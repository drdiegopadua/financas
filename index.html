<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Minhas Finanças</title>
  <meta name="description" content="Controle financeiro pessoal: despesas, parcelas, valores a receber e dashboard.">
  <meta name="theme-color" content="#0f1720">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finanças">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="icons/icon.svg" alt="" width="28" height="28"><span>Minhas Finanças</span></div>
    <div class="month" id="monthNav">
      <button class="icon-btn" data-month="-1" aria-label="Mês anterior">‹</button>
      <button class="month-label" id="monthLabel" data-month="0" title="Voltar ao mês atual"></button>
      <button class="icon-btn" data-month="1" aria-label="Próximo mês">›</button>
    </div>
  </header>

  <main id="view"></main>

  <button class="fab" id="fab" aria-label="Adicionar">+</button>

  <nav class="tabbar">
    <button data-tab="dash" class="active"><span>📊</span>Painel</button>
    <button data-tab="desp"><span>💸</span>Despesas</button>
    <button data-tab="rec"><span>🤝</span>A receber</button>
    <button data-tab="ent"><span>💰</span>Entradas</button>
    <button data-tab="cfg"><span>⚙️</span>Ajustes</button>
  </nav>

  <dialog id="modal"><form method="dialog" id="modalForm"></form></dialog>
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
