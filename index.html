<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Minhas Finanças</title>
  <meta name="description" content="Controle financeiro pessoal: despesas, parcelas, valores a receber, lembretes e dashboard.">
  <meta name="theme-color" content="#2a4870">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finanças">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="avatar-wrap"><img class="avatar" src="icons/icon-192.png" alt="Minhas Finanças"><span id="syncDot" class="sync-dot" hidden title="Google Planilhas"></span></div>
    <div class="month" id="monthNav">
      <button class="icon-btn" data-month="-1" aria-label="Mês anterior">‹</button>
      <button class="month-label" id="monthLabel" data-month="0" title="Voltar ao mês atual"></button>
      <button class="icon-btn" data-month="1" aria-label="Próximo mês">›</button>
    </div>
    <button class="bell" id="bell" aria-label="Lembretes">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-1.7 1.7A.75.75 0 0 0 3.8 19h16.4a.75.75 0 0 0 .5-1.3Z"/></svg>
      <span class="badge" id="bellBadge" hidden></span>
    </button>
  </header>

  <main id="view"></main>

  <button class="fab" id="fab"><i>↗</i><span id="fabTxt">Adicionar</span></button>

  <nav class="tabbar">
    <button data-tab="dash" class="active">Início</button>
    <button data-tab="desp">Despesas</button>
    <button data-tab="rec">A receber</button>
    <button data-tab="ent">Entradas</button>
    <button data-tab="cfg">Ajustes</button>
  </nav>

  <dialog id="modal"><form method="dialog" id="modalForm"></form></dialog>
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
